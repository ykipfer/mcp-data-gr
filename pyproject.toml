[project]
name = "mcp-data-gr"
version = "0.1.0"
description = "MCP server for the data.gr.ch open data portal (Opendatasoft/Huwise Explore API)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=1.26.0",
]

[project.scripts]
mcp-data-gr = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.wheel.force-include]
".env" = ".env"
